    values: 0+0x15
  - series: argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="2"}
    values: 0+0x15
  - series: argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="4"}
    values: 0+0x15
  - series: argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="8"}
    values: 0+0x15
  - series: argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="16"}
    values: 0+20x15
  - series: argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="+Inf"}
    values: 0+20x15
  alert_rule_test:
  - eval_time: 15m
    alertname: ArgoCdAppControllerHighReconciliationDuration
    exp_alerts: []
  name: ArgoCdAppControllerHighReconciliationDuration within last finite bucket
