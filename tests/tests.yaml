# yamllint disable rule:line-length
---
rule_files:
  - ../prometheus_alerts.yaml

tests:
  - interval: 5m
    input_series:
      - series: 'argocd_app_info{autosync_enabled="false", dest_server="https://kubernetes.default.svc", health_status="Healthy", job="argo-cd-argocd-application-controller-metrics", name="ci-cd", namespace="ci-cd", project="ops", sync_status="OutOfSync"}'
        values: "1+0x4"
      - series: 'argocd_app_info{autosync_enabled="false", dest_server="https://kubernetes.default.svc", health_status="Healthy", job="argo-cd-argocd-application-controller-metrics", name="ci-cd-synced", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x4"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCdAppOutOfSync
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-application-controller-metrics
              dest_server: https://kubernetes.default.svc
              project: ops
              name: ci-cd
              sync_status: OutOfSync
            exp_annotations:
              summary: "ArgoCD application is out of sync."
              description: "Application https://kubernetes.default.svc/ops/ci-cd has reported sync status OutOfSync for at least 15m."
              dashboard_url: "https://grafana.com/d/argo-cd-application-overview-kask/argocd-application-overview?var-dest_server=https://kubernetes.default.svc&var-project=ops&var-application=ci-cd"
  - interval: 5m
    input_series:
      - series: 'argocd_app_info{autosync_enabled="true", dest_server="https://kubernetes.default.svc", health_status="Degraded", job="argo-cd-argocd-application-controller-metrics", name="ci-cd", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x4"
      - series: 'argocd_app_info{autosync_enabled="true", dest_server="https://kubernetes.default.svc", health_status="Healthy", job="argo-cd-argocd-application-controller-metrics", name="ci-cd-healthy", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x4"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCdAppUnhealthy
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-application-controller-metrics
              dest_server: https://kubernetes.default.svc
              project: ops
              name: ci-cd
              health_status: Degraded
            exp_annotations:
              summary: "ArgoCD application is unhealthy."
              description: "Application https://kubernetes.default.svc/ops/ci-cd has reported health status Degraded for at least 15m."
              dashboard_url: "https://grafana.com/d/argo-cd-application-overview-kask/argocd-application-overview?var-dest_server=https://kubernetes.default.svc&var-project=ops&var-application=ci-cd"
  - interval: 5m
    input_series:
      - series: 'argocd_app_info{autosync_enabled="false", dest_server="https://kubernetes.default.svc", health_status="Healthy", job="argo-cd-argocd-application-controller-metrics", name="ci-cd", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x40"
      - series: 'argocd_app_info{autosync_enabled="true", dest_server="https://kubernetes.default.svc", health_status="Healthy", job="argo-cd-argocd-application-controller-metrics", name="ci-cd-sync-enabled", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x40"
    alert_rule_test:
      - eval_time: 3h
        alertname: ArgoCdAppAutoSyncDisabled
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-application-controller-metrics
              dest_server: https://kubernetes.default.svc
              project: ops
              name: ci-cd
              autosync_enabled: false
            exp_annotations:
              summary: "ArgoCD application auto-sync is disabled."
              description: "Application https://kubernetes.default.svc/ops/ci-cd has had auto-sync disabled for at least 2h."
              dashboard_url: "https://grafana.com/d/argo-cd-application-overview-kask/argocd-application-overview?var-dest_server=https://kubernetes.default.svc&var-project=ops&var-application=ci-cd"
  - interval: 5m
    input_series:
      - series: 'argocd_app_sync_total{dest_server="https://kubernetes.default.svc", job="argo-cd-argocd-application-controller-metrics", name="ci-cd", namespace="ci-cd", phase="Failed", project="ops", service="argo-cd-argocd-application-controller-metrics"}'
        values: "1+1x4"
      - series: 'argocd_app_sync_total{dest_server="https://kubernetes.default.svc", job="argo-cd-argocd-application-controller-metrics", name="ci-cd-succeeded", namespace="ci-cd", phase="Succeeded", project="ops", service="argo-cd-argocd-application-controller-metrics"}'
        values: "1+1x4"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCdAppSyncFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-application-controller-metrics
              dest_server: https://kubernetes.default.svc
              project: ops
              name: ci-cd
              phase: "Failed"
            exp_annotations:
              summary: "ArgoCD application sync failed."
              description: "Application https://kubernetes.default.svc/ops/ci-cd had at least one sync attempt fail with phase Failed in the last 10m."
              dashboard_url: "https://grafana.com/d/argo-cd-application-overview-kask/argocd-application-overview?var-dest_server=https://kubernetes.default.svc&var-project=ops&var-application=ci-cd"
  - interval: 5m
    input_series:
      - series: 'argocd_notifications_deliveries_total{exported_service="grafana", job="argo-cd-argocd-notifications-controller-metrics", namespace="ci-cd", succeeded="false", trigger="on-deployed"}'
        values: "1+1x4"
      - series: 'argocd_notifications_deliveries_total{exported_service="grafana", job="argo-cd-argocd-notifications-controller-metrics", namespace="ci-cd", succeeded="true", trigger="on-deployed"}'
        values: "1+1x4"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCdNotificationDeliveryFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-notifications-controller-metrics
              exported_service: grafana
              succeeded: false
            exp_annotations:
              summary: "ArgoCD notification delivery failed."
              description: "Notification job argo-cd-argocd-notifications-controller-metrics failed to deliver to grafana at least once in the last 10m."
              dashboard_url: "https://grafana.com/d/argo-cd-notifications-overview-kask/argocd-notifications-overview?var-job=argo-cd-argocd-notifications-controller-metrics&var-exported_service=grafana"
  - interval: 5m
    input_series:
      - series: 'argocd_app_info{autosync_enabled="true", dest_server="https://kubernetes.default.svc", health_status="Progressing", job="argo-cd-argocd-application-controller-metrics", name="ci-cd", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x15"
      - series: 'argocd_app_info{autosync_enabled="true", dest_server="https://kubernetes.default.svc", health_status="Healthy", job="argo-cd-argocd-application-controller-metrics", name="ci-cd-healthy", namespace="ci-cd", project="ops", sync_status="Synced"}'
        values: "1+0x15"
    alert_rule_test:
      - eval_time: 75m
        alertname: ArgoCdRolloutProgressing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-application-controller-metrics
              dest_server: https://kubernetes.default.svc
              project: ops
              name: ci-cd
              health_status: Progressing
            exp_annotations:
              summary: "ArgoCD application rollout is still progressing."
              description: "Application https://kubernetes.default.svc/ops/ci-cd has remained in health status Progressing for more than 1h."
              dashboard_url: "https://grafana.com/d/argo-cd-application-overview-kask/argocd-application-overview?var-dest_server=https://kubernetes.default.svc&var-project=ops&var-application=ci-cd"
  # Operational health alert tests
  - interval: 1m
    input_series:
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="5"}'
        values: "0+0x15"
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="10"}'
        values: "0+0x15"
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="30"}'
        values: "0+0x15"
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="60"}'
        values: "0+1x15"
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="120"}'
        values: "0+4x15"
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="300"}'
        values: "0+19x15"
      - series: 'argocd_app_reconcile_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="+Inf"}'
        values: "0+20x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdAppControllerHighReconciliationDuration
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD application reconciliation is slow."
              description: "The P0.95 application reconciliation duration in namespace argocd has been above 60s for 10m. The application controller may be overloaded or blocked on Kubernetes API calls."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  - interval: 1m
    input_series:
      - series: 'argocd_repo_pending_request_total{job="argo-cd-argocd-repo-server-metrics", namespace="argocd"}'
        values: "55+0x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdRepoServerPendingRequests
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD repo server has pending requests."
              description: "Repo server in namespace argocd has had more than 50 pending requests for 10m. The repo server may be overloaded or waiting on slow repository operations."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  - interval: 1m
    input_series:
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="5"}'
        values: "0+0x15"
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="10"}'
        values: "0+0x15"
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="30"}'
        values: "0+1x15"
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="60"}'
        values: "0+4x15"
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="120"}'
        values: "0+19x15"
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="300"}'
        values: "0+19x15"
      - series: 'argocd_git_request_duration_seconds_bucket{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", le="+Inf"}'
        values: "0+20x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdRepoServerHighGitRequestDuration
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD repo server Git requests are slow."
              description: "The P0.95 Git request duration in namespace argocd has been above 30s for 10m. Repository access, network latency, or repo server load may be degraded."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  - interval: 1m
    input_series:
      - series: 'argocd_cluster_connection_status{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", server="https://prod-cluster.example.com"}'
        values: "0+0x10"
      - series: 'argocd_cluster_connection_status{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", server="https://staging-cluster.example.com"}'
        values: "1+0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: ArgoCdClusterConnectionError
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-application-controller-metrics
              namespace: argocd
              server: https://prod-cluster.example.com
            exp_annotations:
              summary: "ArgoCD cannot connect to a managed cluster."
              description: "ArgoCD in namespace argocd has been unable to connect to cluster https://prod-cluster.example.com for 5m. Check cluster credentials, API server reachability, and network policy."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  - interval: 1m
    input_series:
      - series: 'argocd_git_fetch_fail_total{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", repo="https://github.com/example/repo.git"}'
        values: "0+1x10"
      - series: 'argocd_git_fetch_fail_total{job="argo-cd-argocd-repo-server-metrics", namespace="argocd", repo="https://github.com/example/repo2.git"}'
        values: "0+0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: ArgoCdGitRequestErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
              repo: https://github.com/example/repo.git
            exp_annotations:
              summary: "ArgoCD Git requests are failing."
              description: "ArgoCD in namespace argocd has had Git fetch failures for repository https://github.com/example/repo.git for 5m. Check repository availability, credentials, and network connectivity."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  # ArgoCdHighKubectlRateLimiterDuration
  - interval: 1m
    input_series:
      - series: 'argocd_kubectl_rate_limiter_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="0.5"}'
        values: "0+0x15"
      - series: 'argocd_kubectl_rate_limiter_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="1"}'
        values: "0+0x15"
      - series: 'argocd_kubectl_rate_limiter_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="2"}'
        values: "0+1x15"
      - series: 'argocd_kubectl_rate_limiter_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="5"}'
        values: "0+4x15"
      - series: 'argocd_kubectl_rate_limiter_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="+Inf"}'
        values: "0+20x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdHighKubectlRateLimiterDuration
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD kubectl client-side throttling is high."
              description: "The P0.95 kubectl rate limiter wait time in namespace argocd has been above 1s for 10m. ArgoCD may be throttling requests before they reach the Kubernetes API server."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  # ArgoCdHighKubectlRequestDuration
  - interval: 1m
    input_series:
      - series: 'argocd_kubectl_request_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="10"}'
        values: "0+0x15"
      - series: 'argocd_kubectl_request_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="30"}'
        values: "0+1x15"
      - series: 'argocd_kubectl_request_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="60"}'
        values: "0+4x15"
      - series: 'argocd_kubectl_request_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="120"}'
        values: "0+19x15"
      - series: 'argocd_kubectl_request_duration_seconds_bucket{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", le="+Inf"}'
        values: "0+20x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdHighKubectlRequestDuration
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD kubectl requests are slow."
              description: "The P0.95 kubectl request duration in namespace argocd has been above 5s for 10m. The Kubernetes API server or network path may be slow."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  # ArgoCdHighKubectlRequestRetryRate
  - interval: 30s
    input_series:
      - series: 'argocd_kubectl_request_retries_total{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", container="argocd-application-controller", method="GET", code="429"}'
        values: "0+30x42"
    alert_rule_test:
      - eval_time: 21m
        alertname: ArgoCdHighKubectlRequestRetryRate
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD kubectl request retry rate is high."
              description: "ArgoCD in namespace argocd has had more than 50 kubectl request retries per minute for 10m. This usually points to Kubernetes API errors, throttling, or network instability."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  # ArgoCdHighGrpcErrorRate
  - interval: 1m
    input_series:
      - series: 'grpc_server_handled_total{job="argo-cd-argocd-server-metrics", namespace="argocd", grpc_service="application.ApplicationService", grpc_method="List", grpc_code="OK"}'
        values: "0+10x20"
      - series: 'grpc_server_handled_total{job="argo-cd-argocd-server-metrics", namespace="argocd", grpc_service="application.ApplicationService", grpc_method="List", grpc_code="Internal"}'
        values: "0+10x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdHighGrpcErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: argo-cd-argocd-server-metrics
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD gRPC error rate is high."
              description: "ArgoCD job argo-cd-argocd-server-metrics in namespace argocd has had a gRPC error rate above 5% for 10m. Check argocd-server errors and upstream dependencies."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
  # ArgoCdHighKubectlPendingExec
  - interval: 1m
    input_series:
      - series: 'argocd_kubectl_exec_pending{job="argo-cd-argocd-application-controller-metrics", namespace="argocd", command="apply"}'
        values: "15+0x15"
    alert_rule_test:
      - eval_time: 15m
        alertname: ArgoCdHighKubectlPendingExec
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: argocd
            exp_annotations:
              summary: "ArgoCD has many pending kubectl executions."
              description: "ArgoCD in namespace argocd has had more than 10 pending kubectl executions for 15m. This may indicate resource contention, slow Kubernetes API calls, or slow manifest generation."
              dashboard_url: "https://grafana.com/d/argo-cd-operational-overview-kask/argocd-operational-overview"
